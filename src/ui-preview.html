function modal(title,body,actions=[]){running=false;section=title;let full=screenTitles.includes(title),dialog=document.querySelector('.dialog');(full?$('screen'):$('modal')).append(dialog);dialog.setAttribute('role',full?'region':'dialog');dialog.classList.toggle('menu-dialog',title==='Меню');if(full){dialog.removeAttribute('aria-modal');if(['Меню','Улучшения','Карточки','Задания','Достижения','Магазин'].includes(title))activeTab=title;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.name===activeTab));}else dialog.setAttribute('aria-modal','true');$('screen').hidden=!full;$('home-content').hidden=full||!!activeTab;$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-actions').replaceChildren(...actions.map(a=>button(...a)));$('modal').hidden=full;document.querySelector('main').inert=!full;$('tabs').inert=!full;$('close').textContent=full?'←':'×';$('close').setAttribute('aria-label',full?'Вернуться к дому':'Закрыть окно');if(!full)$('close').focus();}
function resume(){if(notifications.length){let t=notifications.shift();if(t&&t.final){modal('Дом освоен','<div class="reward">'+icon('trophy')+'<h3>5 / 5</h3><p>Человек всё ещё платит за квартиру. Колония остаётся.</p></div><p>Коконов: '+game.s.caught+' · уборок: '+game.s.raids+' · в игре: '+Math.floor(game.s.time/60)+' мин</p><p class="note">Шёлк & прибыль · Паук против человека<br>Код, графика и звук созданы для этой игры.</p>',[['Продолжить играть',resume,true],['Статистика',stats]]);return;}modal('Новый уровень','<div class="reward">'+icon('spider')+'<h3>'+esc(t)+'</h3><p>Загляни в улучшения: там появились новые возможности.</p></div>',[['Забрать и продолжить',resume,true]]);return;}inTitleScreen=false;document.body.classList.remove('title-screen');$('modal').hidden=true;$('screen').hidden=true;$('home-content').hidden=false;activeTab='';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.name==='Дом'));document.querySelector('main').inert=false;$('tabs').inert=false;running=true;last=performance.now();Sound.start();update();}
function process(){for(let e of game.events.splice(0)){if(e.type==='level')notifications.push(e.text);else if(e.type==='final')notifications.push({final:true});else if(!['ready','weave','catch'].includes(e.type))toast(e.text);Sound.fx(e.type);let scene=scenes[game.s.room];if(e.type==='hit'){scene.impact=1.2;if(settings.shake)scene.shake=9;}if(e.type==='catch'&&Art.points[e.slot]){scene.px=Art.points[e.slot][0];scene.py=Art.points[e.slot][1];}if(['buy','catch','weave'].includes(e.type))scene.burst(e.slot,e.text);}if(notifications.length&&running)resume();}
function act(fn){fn();process();save();update();}
function setupHouse(){scenes=[];$('house').innerHTML=Silk.rooms.map((r,i)=>'<article class="room" id="room-'+i+'"><div class="room-head"><div><h2>'+r.name+'</h2><small>'+r.prey+'</small></div><b id="rate-'+i+'"></b></div><div class="scene"><canvas id="canvas-'+i+'" aria-label="'+r.name+'"></canvas><button class="scene-hit" id="collect-'+i+'"><span></span></button></div><div class="room-foot"><div id="room-note-'+i+'"></div><button id="upgrade-'+i+'">Улучшить</button></div></article>').join('');Silk.rooms.forEach((r,i)=>{scenes.push(new Art.Scene($('canvas-'+i)));$('collect-'+i).onclick=()=>{if(i>game.s.unlocked){roomUpgrade(i);return;}act(()=>{if(i!==game.s.room&&!game.travel(i)){toast('Дождись конца уборки');return;}let caught=false;for(let n=0;n<6;n++)caught=game.collect(n)||caught;if(!caught)toast('Улов ещё в пути.');});};$('upgrade-'+i).onclick=()=>roomUpgrade(i);});}
function update(){let s=game.s,m=s.meta,l=game.level(),start=(l-1)**2*30;if(m.guest>0)$('save-status').textContent='Серебряный гость ждёт в магазине · '+Math.ceil(m.guest)+' с';$('silk').innerHTML=icon('silk')+Math.floor(s.silk);$('food').innerHTML=icon('food')+Math.floor(s.food);$('amber').innerHTML=icon('amber')+(m.amber||0);$('level').textContent='Уровень '+l;$('xp-label').textContent='';$('xp').style.width=Math.min(100,(m.xp-start)/(game.xpNext()-start)*100)+'%';$('threat').classList.toggle('danger',s.warning);$('threat-title').textContent=s.shield>0?'Пауки в укрытии':s.warning?Silk.attacks[s.raids%6].name+' — '+Math.ceil(s.timer)+' с':'До уборки '+Math.ceil(s.timer)+' с';$('threat-note').textContent=s.warning?'Тень на стене. Пора прятаться.':'Сети '+Math.ceil(s.hp)+'% · '+Silk.rooms[s.room].name;$('shield').disabled=s.shieldCooldown>0||s.silk<(s.tech[5]?8:12);$('shield').textContent=s.shield>0?'Укрыты':'Укрыть · '+(s.tech[5]?8:12);$('weave').disabled=s.weaveCooldown>0;$('repair').disabled=s.food<12;Silk.rooms.forEach((r,i)=>{let locked=i>s.unlocked,ready=(i===s.room?s.webs:s.rooms[i]||[]).reduce((n,w)=>n+(w?.ready||0),0);$('room-'+i).classList.toggle('locked',locked);$('rate-'+i).textContent=locked?'Ур. '+Silk.roomLevels[i]:(i===s.room?'● ':'')+game.income(i).toFixed(3)+' шёлка/с';$('room-note-'+i).innerHTML=locked?'Открытие: '+r.cost+' шёлка':'Улучшение '+m.upgrades[i]+'<small>'+(i===s.room?'Работает сейчас':'Производство при переходе')+'</small>';$('collect-'+i).querySelector('span').innerHTML=locked?icon('lock')+'Откроется на уровне '+Silk.roomLevels[i]:ready?'Собрать ×'+ready:i===s.room?'Нажми, чтобы собрать':'Перейти в комнату';$('upgrade-'+i).textContent=locked?'Открыть':'Улучшить';});}
function roomUpgrade(i){let s=game.s,locked=i>s.unlocked,cost=locked?Silk.rooms[i].cost:game.upgradeCost(i),a=game.roomStats(i),b=game.roomStats(i,1),reason=locked?game.travelReason(i):a.level>=100?'Максимальный уровень':s.silk<cost?'Не хватает '+Math.ceil(cost-s.silk)+' шёлка':'';modal(Silk.rooms[i].name,locked?'<p>'+Silk.rooms[i].desc+'</p><p>Открытие на уровне '+Silk.roomLevels[i]+'</p>':'<p>Уровень комнаты '+a.level+' → '+b.level+'</p><div class="compare"><div>Сейчас<b>'+a.income.toFixed(3)+'</b>шёлка/с</div><span>→</span><div>После<b>'+b.income.toFixed(3)+'</b>шёлка/с</div></div><p>Добыча: '+a.yield+'% → '+b.yield+'% от базовой. Больше еды и шёлка за каждый кокон.</p><p class="note">Скорость без изменений · Вместимость: 3 кокона на сеть.</p>',[[icon('up')+' '+(locked?'Открыть':'Улучшить')+' · '+cost+' шёлка',()=>{let ok=false;act(()=>{ok=locked?game.travel(i):game.upgradeRoom(i);});if(ok)resume();else toast('Покупка недоступна во время уборки');},true]]);let btn=$('modal-actions').querySelector('button');btn.disabled=!!reason;$('modal-body').insertAdjacentHTML('beforeend','<p>Цена: '+cost+' · Есть: '+Math.floor(s.silk)+' шёлка</p>'+(reason?'<p class="shortage">'+reason+'</p>':''));}
function menu(){save();let hasSave=loaded&&(game.s.time>0||game.s.silk>0||game.s.caught>0);let statusHTML=hasSave?'<div class="menu-colony-card"><div class="colony-card-header"><span class="colony-card-pill">'+icon('house')+' ТЕКУЩАЯ КОЛОНИЯ</span><span class="colony-time">'+Math.floor(game.s.time/60)+' мин в игре</span></div><div class="colony-stats-grid"><div class="colony-stat"><span class="stat-value">'+game.level()+'</span><span class="stat-label">Уровень</span></div><div class="colony-stat"><span class="stat-value">'+(game.s.unlocked+1)+'/5</span><span class="stat-label">Комнат</span></div><div class="colony-stat"><span class="stat-value">'+Math.floor(game.s.silk)+'</span><span class="stat-label">Шёлка</span></div><div class="colony-stat"><span class="stat-value">'+Math.floor(game.s.food)+'</span><span class="stat-label">Еды</span></div></div></div>':'<div class="menu-colony-card new-colony-card"><div class="colony-card-header"><span class="colony-card-pill">'+icon('spider')+' ДОМ № 08</span><span class="colony-time">Новая жизнь</span></div><p class="colony-welcome-msg">Пять комнат, шесть видов уборки и колония под носом у человека.</p></div>';let heroHTML='<div class="menu-hero"><div class="menu-spider-emblem"><div class="menu-spider-icon">'+icon('spider')+'</div></div><div class="menu-badge-label">ПАУК ПРОТИВ ЧЕЛОВЕКА</div><h1 class="menu-hero-title">Шёлк & прибыль</h1><p class="menu-hero-desc">Человек опять достал тапок. Но паутину уже не остановить.</p></div>'+statusHTML+'<div class="menu-nav-list" id="menu-list"></div><div class="menu-meta-footer"><span>Шёлк & прибыль · WebAudio · Canvas</span><small>'+(storage?'Автосохранение включено':'Хранилище недоступно')+'</small></div>';modal('Меню',heroHTML);let list=$('menu-list');function makeMenuBtn(title,fn,ico,subtext='',primary=false){let b=document.createElement('button');b.className='menu-btn'+(primary?' menu-btn-primary':'');b.innerHTML=icon(ico)+'<span>'+title+'</span>'+(subtext?'<small>'+subtext+'</small>':'');b.onclick=()=>{Sound.start();Sound.fx('click');fn();};return b;}if(inTitleScreen){if(hasSave){list.append(makeMenuBtn('Продолжить игру',startGame,'spider','Уровень '+game.level(),true));list.append(makeMenuBtn('Новая игра',newGame,'web','Начать заново'));}else{list.append(makeMenuBtn('Начать игру',startGame,'spider','В дом № 08',true));}}else{list.append(makeMenuBtn('Вернуться к дому',resume,'spider','Продолжить',true));list.append(makeMenuBtn('В главное меню',toTitleScreen,'house','На титульный экран'));list.append(makeMenuBtn('Новая игра',newGame,'web','Начать заново'));}list.append(makeMenuBtn('Как играть',tutorial,'quest','Обучение и советы'));list.append(makeMenuBtn('Сохранения',slots,'silk','3 слота'));list.append(makeMenuBtn('История и статистика',stats,'trophy','Хроника и опыт'));list.append(makeMenuBtn('Настройки',settingsMenu,'up','Звук, тема, визуализация'));list.append(makeMenuBtn('Об игре',about,'lamp','Джем «Паук против человека»'));}
function newGame(){modal('Новая игра','<p>Автосохранение заменится. Именованные слоты останутся. Сохрани текущую колонию в слот, если хочешь вернуться.</p>',[['Сохранить в слот',slots],['Начать заново',()=>{game=new Silk.Game();notifications=[];setupHouse();save();startGame();},true]]);}
function slots(){let data=read('silk-ui-check-slots',{});modal('Сохранения','<p class="note">Три независимых слота. Автосохранение работает отдельно.</p><div id="slot-list"></div>',[['В меню',menu]]);for(let i=1;i<=3;i++){let d=data[i],row=document.createElement('div');row.className='row';row.innerHTML='<h3>Слот '+i+(d?' · '+esc(d.name):' · пусто')+'</h3><small>'+(d?esc(d.date)+' · уровень '+new Silk.Game(d.state).level()+' · '+(d.state.unlocked+1)+'/5 комнат · '+Math.floor(d.state.time/60)+' мин':'Нет сохранения')+'</small><label>Название<input id="slot-name-'+i+'" maxlength="32" value="'+esc(d?.name||'Колония '+i)+'"></label><div class="inline"></div>';let controls=row.querySelector('.inline');controls.append(button('Записать',()=>{let write=()=>{data[i]={name:$('slot-name-'+i)?.value.trim()||d?.name||'Колония '+i,date:new Date().toLocaleString('ru'),state:JSON.parse(JSON.stringify(game.s))};if(store('silk-ui-check-slots',data)){toast('Слот записан');slots();}};if(d){let name=$('slot-name-'+i).value;modal('Заменить слот '+i+'?','<p>Предыдущая запись в этом слоте будет заменена.</p>',[['Отмена',slots],['Заменить',()=>{data[i]={name:name||'Колония '+i,date:new Date().toLocaleString('ru'),state:JSON.parse(JSON.stringify(game.s))};store('silk-ui-check-slots',data);slots();},true]]);}else write();}));if(d){controls.append(button('Загрузить',()=>{if(!Silk.valid(d.state)){toast('Слот повреждён');return;}game=new Silk.Game(d.state);notifications=[];setupHouse();save();startGame();}));controls.append(button('Удалить',()=>modal('Удалить слот '+i+'?','<p>Автосохранение не затронется.</p>',[['Отмена',slots],['Удалить',()=>{delete data[i];store('silk-ui-check-slots',data);slots();}]])));}$('slot-list').append(row);}}
function stats(){let s=game.s;modal('История и статистика','<div class="row">В игре: '+Math.floor(s.time/60)+' мин<br>Коконов: '+s.caught+'<br>Уборок: '+s.raids+' · под защитой: '+s.protected+'<br>Комнат: '+(s.unlocked+1)+'/5 · технологий: '+s.tech.filter(Boolean).length+'/12</div>'+s.meta.history.map(h=>'<div class="row"><small>'+Math.floor(h.time/60)+' мин</small>'+esc(h.text)+'</div>').join(''),[['В меню',menu]]);}
function about(){modal('Об игре','<p>Шёлк & прибыль — тайкун для джема «Паук против человека».</p><p>Пять комнат, шесть видов уборки и колония, которую нельзя прихлопнуть насовсем.</p><p>Код, Canvas-графика, SVG-иконки и синтезированный звук созданы для этой игры. Без внешних ассетов, рекламы и платежей.</p><small>Прогресс хранится в браузере на этом устройстве. Очистка данных браузера удаляет сохранения.</small>',[['В меню',menu]]);}

function help(){let text={'Карточки':'Карты из паков дают постоянные бонусы. Дубликаты остаются в коллекции, но бонус не складывается. В паке выбираешь одну из девяти карт. За выбор — 3 янтарные капли. Умения тратят заряд; их можно купить за капли.','Улучшения':'Ловушки покупаются за шёлк, помощники и технологии — за еду. Покупка даёт опыт. Зависимости технологий сохраняются.','Задания':'За постоянные и ежедневные задания забирай награды вручную. Новый день определяется часами устройства.','Достижения':'Награда 25 еды выдаётся автоматически и только один раз.','Магазин':'Здесь нет денег и рекламы. Паки и ускорение покупаются за шёлк. Ежедневный подарок доступен раз в календарный день.','Меню':'Автосохранение — каждые пять секунд и после действий. Именованные слоты не перезаписываются автоматически.'};let prev=section;modal('Справка','<p>'+esc(text[prev]||'Управляй домом через комнаты и нижние вкладки. В окнах игра стоит на паузе.')+'</p>',[['Назад',()=>openTab(prev)]]);}
function upgrades(){modal('Улучшения','<div class="subtabs" id="subtabs"></div><div id="purchase-list"></div>');[['build','Ловушки'],['crew','Команда'],['tech','Технологии']].forEach(([k,t])=>{let b=button(t,()=>{sub=k;upgrades();});b.classList.toggle('active',sub===k);$('subtabs').append(b);});let list=sub==='build'?Silk.traps:sub==='crew'?Silk.crew:Silk.tech;list.forEach((item,i)=>{let reason=game.locked(sub,i),done=sub==='tech'&&game.s.tech[i],max=sub==='crew'&&game.s.crew[i]>=5;let row=document.createElement('article');row.className='row';row.innerHTML='<h3>'+icon(item.icon)+' '+item.name+'</h3><p>'+item.desc+'</p>';row.append(button(done?'Изучено':max?'Команда полная':reason||'Посмотреть · '+game.price(sub,i)+' '+(sub==='build'?'шёлка':'еды'),()=>purchase(sub,i)));$('purchase-list').append(row);});}
function purchase(kind,i){let item=(kind==='build'?Silk.traps:kind==='crew'?Silk.crew:Silk.tech)[i],s=game.s,cost=game.price(kind,i),slot=s.webs.indexOf(null),reason=game.locked(kind,i)||(kind==='build'&&slot<0?'Все шесть точек заняты':kind==='tech'&&s.tech[i]?'Уже изучено':kind==='crew'&&s.crew[i]>=5?'Команда полная':s[kind==='build'?'silk':'food']<cost?'Не хватает ресурсов':'');let before=kind==='crew'?s.crew[i]:kind==='tech'?(s.tech[i]?1:0):s.webs.filter(Boolean).length,after=before+1;modal(item.name,'<p>'+item.desc+'</p><div class="compare"><div>Сейчас<b>'+before+'</b></div><span>→</span><div>После покупки<b>'+after+'</b></div></div><p class="note">'+Silk.rooms[s.room].name+'</p>',[[reason||'Купить · '+cost+' '+(kind==='build'?'шёлка':'еды'),()=>{if(reason){toast(reason);return;}act(()=>game.buy(kind,i,slot));upgrades();},!reason]]);}
function portrait(c){return CardArt.portrait(c);}
function cardHTML(c,reveal=false){let count=game.s.meta.cards[c.id]||0;return '<article class="card '+(!count&&!reveal?'absent ':'')+(reveal?'reveal':'')+'" style="--rarity:'+['#a2b6a8','#82c79d','#a99adc','#e0b85f'][c.rarity]+'"><span class="count">'+(count?'×'+count:'')+'</span>'+portrait(c)+'<strong>'+c.name+'</strong><small>'+Silk.rarities[c.rarity]+'</small><small>'+(c.active?c.effect:c.bonus)+'</small></article>';}
function cards(){if(game.level()<2){modal('Карточки','<p>Коллекция откроется на уровне 2. Собирай коконы и покупай улучшения.</p>');return;}modal('Карточки','<p class="note">'+Object.keys(game.s.meta.cards).length+' / '+Silk.cards.length+' · улов +'+Math.round(game.cardBonus('Пауки')*100)+'% · шёлк +'+Math.round(game.cardBonus('Насекомые')*100)+'%</p><div id="pack-button"></div><label>Редкость<select id="rarity">'+['Все',...Silk.rarities].map(r=>'<option'+(r===rarity?' selected':'')+'>'+r+'</option>').join('')+'</select></label><div class="filters" id="filters"></div><div class="cards" id="collection"></div>');$('pack-button').append(button('Открыть пак · в запасе '+game.s.meta.packs,openPack,true));$('rarity').onchange=e=>{rarity=e.target.value;renderCards();};['Все','Пауки','Насекомые','Предметы','Умения'].forEach(t=>{let b=button(t,()=>{filter=t;cards();});b.classList.toggle('active',filter===t);$('filters').append(b);});renderCards();}
function renderCards(){let list=Silk.cards.filter(c=>(filter==='Все'||c.group===filter)&&(rarity==='Все'||Silk.rarities[c.rarity]===rarity));$('collection').replaceChildren(...list.map(c=>{let b=button(cardHTML(c),()=>cardDetail(c.id));b.className='card-button';b.setAttribute('aria-label',c.name);return b;}));}
function cardDetail(id){let c=Silk.cards[id],m=game.s.meta,actions=[['В коллекцию',cards]];if(c.active){actions.unshift(['Использовать · '+(m.skills[id]||0)+' шт.',()=>{if(!game.useAbility(id)){toast('Нет зарядов умения');return;}save();resume();},true]);actions.push([icon('amber')+' Купить заряд · '+c.cost,()=>{if(!game.buyAbility(id))toast('Нужен уровень 2 и '+c.cost+' янтарных капель');save();update();cardDetail(id);}]);}modal(c.name,'<div class="card-detail">'+portrait(c)+'</div><p>'+Silk.rarities[c.rarity]+' · '+c.group+'</p><p>'+(c.active?c.effect:c.bonus)+'</p><p class="note">'+(c.active?'Заряды: '+(m.skills[id]||0):m.cards[id]?'Бонус действует. Дубликаты не усиливают его.':'Пока не найдена. Можно получить из пака.')+'</p>',actions);}
function openPack(){let p=game.beginPack();if(!p){toast(game.level()<2?'Нужен уровень 2':'Паков нет. Загляни в магазин.');return;}save();let done=p.chosen!==null,c=done?Silk.cards[p.cards[p.chosen]]:null;modal(done?'Твоя находка':'Выбери одну карту','<p>'+(done?c.name+' · '+Silk.rarities[c.rarity]+'<br>'+(c.active?c.effect:c.bonus)+'<br>Карта твоя. Ещё +3 янтарные капли. Остальные — только посмотреть.':'Одна карта твоя. Остальные покажем после выбора.')+'</p><div class="pack-grid" id="pack-grid"></div>',done?[['Забрать',()=>{game.finishPack();save();cards();},true]]:[]);p.cards.forEach((id,i)=>{let b=button(done?cardHTML(Silk.cards[id],true):'<span class="card-back">'+icon('cards')+'</span>',()=>{if(game.choosePack(i)){save();update();Sound.fx('achievement');openPack();}});b.setAttribute('aria-label','Карта '+(i+1));b.disabled=done;b.className=done?(p.chosen===i?'chosen':'unchosen'):'';$('pack-grid').append(b);});}
function quests(){modal('Задания','<div id="quest-list"></div>');game.quests().forEach(q=>{let row=document.createElement('div');row.className='row';row.innerHTML='<h3>'+icon('quest')+' '+q.name+'</h3><small>'+Math.min(q.value,q.target)+' / '+q.target+' · '+q.reward+' шёлка</small><div class="meter"><i style="width:'+Math.min(100,q.value/q.target*100)+'%"></i></div>';let b=button(q.claimed?'Получено':q.value>=q.target?'Забрать награду':'В процессе',()=>{act(()=>game.claimQuest(q.id));quests();});b.disabled=q.claimed||q.value<q.target;row.append(b);$('quest-list').append(row);});}
function achievements(){modal('Достижения',Silk.achievements.map(a=>'<div class="row"><h3>'+icon(game.s.achieved.includes(a[0])?'trophy':'shield')+' '+a[1]+'</h3><p>'+a[2]+'</p><small>'+(game.s.achieved.includes(a[0])?'Получено · 25 еды':'Награда: 25 еды')+'</small></div>').join(''));}
function shop(){modal('Магазин','<p class="note">Только игровые ресурсы. Всё без рекламы.</p><div id="offers" class="menu-list"></div>');[['Ежедневный подарок · 50 шёлка и пак',()=>{if(!game.dailyBonus())toast('Сегодня подарок уже получен');else toast('Подарок получен');}],['Пак: выбор из девяти · 80 шёлка',()=>{if(game.level()<2){toast('Нужен уровень 2');return;}if(game.s.silk<80){toast('Не хватает шёлка');return;}game.s.silk-=80;game.s.meta.packs++;}],['Улов ×2 на 3 минуты · 100 шёлка',()=>{if(game.level()<3){toast('Нужен уровень 3');return;}if(game.s.silk<100){toast('Не хватает шёлка');return;}game.s.silk-=100;game.s.meta.boost+=180;}]].forEach(([t,f])=>$('offers').append(button(icon('trophy')+' '+t,()=>{act(f);shop();})));$('offers').append(button(icon('cards')+' Открыть коллекцию',cards));Silk.abilities.forEach(a=>$('offers').append(button(icon(a.icon)+' '+a.name+' · '+a.cost+' янтарных капель',()=>cardDetail(a.id))));$('offers').append(button(icon('amber')+' 5 янтарных капель · 60 шёлка',()=>{if(game.level()<2){toast('Нужен уровень 2');return;}if(game.s.silk<60){toast('Не хватает '+Math.ceil(60-game.s.silk)+' шёлка');return;}game.s.silk-=60;game.s.meta.amber+=5;save();update();shop();}));if(game.s.meta.guest>0)$('offers').append(button('Серебряный гость · забрать 80 шёлка и пак',()=>{act(()=>game.guestGift());shop();},true));}
function settingsMenu(){modal('Настройки','<label>Тема<select id="theme">'+[['dark','Тёмная'],['light','Светлая'],['basement','Подвал'],['attic','Чердак']].map(([k,t])=>'<option value="'+k+'"'+(settings.theme===k?' selected':'')+'>'+t+'</option>').join('')+'</select></label><label>Акцент <input type="color" id="accent" value="'+settings.accent+'"></label><label>Размер текста <input type="range" id="font" min="13" max="19" value="'+settings.font+'"></label><label>Отступы <input type="range" id="density" min="10" max="24" value="'+settings.density+'"></label><label><input type="checkbox" id="motion" '+(settings.motion?'checked':'')+'> Анимации и частицы</label><label><input type="checkbox" id="shake" '+(settings.shake?'checked':'')+'> Тряска при ударе</label><label>Звуки <input type="range" id="sfx" min="0" max="1" step="0.05" value="'+settings.sfx+'"></label><label>Музыка <input type="range" id="music" min="0" max="1" step="0.05" value="'+settings.music+'"></label><div class="inline" id="presets"></div>',[['Готово',menu,true]]);Object.keys(defaults).forEach(k=>{$(k).oninput=e=>{settings[k]=e.target.type==='checkbox'?e.target.checked:['font','density','sfx','music'].includes(k)?+e.target.value:e.target.value;applySettings();store('silk-ui-check-settings',settings);Sound.start();if(k==='sfx')Sound.fx('click');};});$('presets').append(button('Сохранить свой пресет',()=>{if(store('silk-custom-preset',settings))toast('Пресет сохранён');}),button('Загрузить свой',()=>{let p=read('silk-custom-preset',null);if(!p){toast('Сначала сохрани пресет');return;}settings={...defaults,...p};applySettings();store('silk-ui-check-settings',settings);settingsMenu();}));}
function openTab(name){activeTab=name;({'Дом':resume,'Улучшения':upgrades,'Карточки':cards,'Задания':quests,'Достижения':achievements,'Магазин':shop,'Меню':menu}[name]||menu)();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.name===name));}
[['Дом','house'],['Улучшения','up'],['Карточки','cards'],['Задания','quest'],['Достижения','trophy'],['Магазин','shop'],['Меню','menu']].forEach(([t,i])=>{let b=button(icon(i)+'<span>'+t+'</span>',()=>openTab(t));b.dataset.name=t;$('tabs').append(b);});
$('help').onclick=tutorial;$('modal-help').onclick=help;$('close').onclick=()=>{if(inTitleScreen)menu();else resume();};$('weave').onclick=()=>act(()=>game.weave());$('repair').onclick=()=>act(()=>game.repair());$('shield').onclick=()=>act(()=>game.protect());document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden?menu():(inTitleScreen?menu():resume());});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){save();menu();}});window.addEventListener('pagehide',save);
setupHouse();update();toTitleScreen();
function frame(now){let dt=Math.max(0,Math.min(.1,(now-last)/1000));last=now;if(running){game.tick(dt);process();clock+=dt;if(clock>5){clock=0;save();}}Sound.update(dt,running);for(let i=0;i<5;i++){let c=$('canvas-'+i),r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;let s=game.s,preview=i===s.room?s:{...s,room:i,webs:s.rooms[i]||[{type:0,hp:100,ready:0,progress:0},null,null,null,null,null],warning:false,shield:0,poison:0};scenes[i].draw(preview,i<=s.unlocked&&settings.motion?dt:0);if(!settings.shake)scenes[i].shake=0;if(!settings.motion)scenes[i].fx=[];}ui+=dt;if(ui>.2){ui=0;update();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script></body></html>
